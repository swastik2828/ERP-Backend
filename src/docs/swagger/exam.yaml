tags:
  - name: Examinations
    description: Examination, marks, and report card management

paths:
  /api/v1/examinations:
    post:
      tags:
        - Examinations
      summary: Create a new examination
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - academicSessionId
                - name
                - examType
                - startDate
                - endDate
              properties:
                academicSessionId:
                  type: string
                  format: uuid
                name:
                  type: string
                  example: "Mid-Term Examination 2026"
                examType:
                  type: string
                  enum: [UNIT_TEST, MONTHLY_TEST, QUARTERLY, HALF_YEARLY, MID_TERM, PRE_BOARD, ANNUAL]
                description:
                  type: string
                startDate:
                  type: string
                  format: date-time
                endDate:
                  type: string
                  format: date-time
      responses:
        '201':
          description: Examination created successfully
        '400':
          description: Validation Error or Duplicate Exam Name
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (Requires SUPER_ADMIN or SCHOOL_ADMIN)

  /api/v1/examinations/{examId}/subjects:
    post:
      tags:
        - Examinations
      summary: Map a subject to an examination
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: examId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - subjectId
                - classId
                - maxMarks
                - passMarks
              properties:
                subjectId:
                  type: string
                  format: uuid
                classId:
                  type: string
                  format: uuid
                sectionId:
                  type: string
                  format: uuid
                maxMarks:
                  type: number
                  example: 100
                passMarks:
                  type: number
                  example: 33
                weightage:
                  type: number
                  default: 100
      responses:
        '201':
          description: Subject mapped successfully
        '404':
          description: Exam not found

  /api/v1/examinations/marks/bulk:
    post:
      tags:
        - Examinations
      summary: Bulk enter student marks for an exam subject
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - marks
              properties:
                marks:
                  type: array
                  items:
                    type: object
                    required:
                      - studentId
                      - examSubjectId
                      - marksObtained
                    properties:
                      studentId:
                        type: string
                        format: uuid
                      examSubjectId:
                        type: string
                        format: uuid
                      marksObtained:
                        type: number
                      remarks:
                        type: string
      responses:
        '200':
          description: Marks recorded successfully
        '403':
          description: Examination is locked

  /api/v1/examinations/marks/verify:
    post:
      tags:
        - Examinations
      summary: Verify and lock marks for a group of students
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - examSubjectId
                - studentIds
              properties:
                examSubjectId:
                  type: string
                  format: uuid
                studentIds:
                  type: array
                  items:
                    type: string
                    format: uuid
      responses:
        '200':
          description: Marks verified successfully

  /api/v1/examinations/results/generate:
    post:
      tags:
        - Examinations
      summary: Generate computed results for a class
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - examId
                - classId
              properties:
                examId:
                  type: string
                  format: uuid
                classId:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Results generated successfully

  /api/v1/examinations/report-cards/student/{studentId}:
    get:
      tags:
        - Examinations
      summary: Get student report card
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: studentId
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: examId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Report card generated successfully
        '403':
          description: Results not published yet